services:
  - type: web
    name: razorpay-headless-api
    env: python
    # Render auto-detects Python 3.11; override via PYTHON_VERSION if needed
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: CRON_SECRET
        generateValue: true
      - key: LOG_FORMAT
        value: text
      # Optional: increase workers/timeout if needed
      # - key: PYTHON_VERSION
      #   value: 3.11.0
  - type: cron
    name: razorpay-cron-warmup
    env: python
    schedule: "*/15 * * * *"  # every 15 min keep browser warm (Render free sleeps)
    buildCommand: pip install httpx
    startCommand: python -c "import os,httpx; url=os.getenv('WEB_URL','https://razor-pay-headless-payment.onrender.com')+'/cron/health?secret='+os.getenv('CRON_SECRET',''); print(httpx.get(url, timeout=10).text)"
    envVars:
      - key: WEB_URL
        value: https://razor-pay-headless-payment.onrender.com
      - key: CRON_SECRET
        fromService:
          name: razorpay-headless-api
          type: web
          property: CRON_SECRET
